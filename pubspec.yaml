name: captains_sidestick
description: Flight simulator sidestick controller — connects to PC via WebSocket.
publish_to: 'none'
version: 2.2.1+6

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Reactive state management
  provider: ^6.1.1

  # Sensor access — rotation vector / quaternion
  sensors_plus: ^4.0.2

  # Persistent settings storage
  shared_preferences: ^2.2.2

  # WebSocket client
  web_socket_channel: ^2.4.0

  # QR code scanner (settings panel — scan PC app QR for IP)
  mobile_scanner: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
